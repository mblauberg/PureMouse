name: Feature idea
description: Something PureMouse could do.
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way.
  - type: textarea
    id: idea
    attributes:
      label: The idea
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives tried
      description: Settings, config keys or other tools you tried.
