name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request supersedes its running checks; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The `main` ruleset requires this job by name: rename it only together with the ruleset.
  test:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build the universal app bundle
        run: scripts/build-app.sh --universal
      - name: Verify the bundle's signatures
        run: scripts/verify-bundle.sh .build/app/PureMouse.app
      - name: Check the size budget
        run: scripts/check-size.sh .build/app/PureMouse.app
      - name: Script tests
        run: scripts/tests/run.sh
      - name: Pack the bundle
        run: ditto -c -k --keepParent .build/app/PureMouse.app .build/PureMouse-ci.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PureMouse-${{ github.sha }}
          path: .build/PureMouse-ci.zip
          retention-days: 7
          if-no-files-found: error
